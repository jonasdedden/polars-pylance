[build-system]
# hatchling rather than uv_build: uv_build cannot take a `dynamic` version, so
# it cannot be driven from the git tag.
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[project]
name = "polars-pylance"
# Derived from the git tag by uv-dynamic-versioning; see [tool.hatch.version].
dynamic = ["version"]
description = "Lazy, streaming Lance <-> Polars integration: scan_lance() and sink_lance()"
readme = "README.md"
# The distribution name carries the token `pylance`, not `lance`, so these keep
# a bare `lance` in the metadata PyPI searches.
keywords = ["polars", "lance", "arrow", "lazyframe", "streaming"]
requires-python = ">=3.10"
authors = [{ name = "Jonas Dedden" }]
license = "MIT"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    # 1.44.0 is the floor because it is the first release without the
    # unevaluable `dynamic_pred` node pushed to IO plugins (broken
    # 1.39.0-1.43.2), which is the hook `scan_lance` is built on.
    "polars>=1.44.0",
    "pylance>=9",
    "pyarrow",
]

[project.urls]
Homepage = "https://github.com/jonasdedden/polars-pylance"
Repository = "https://github.com/jonasdedden/polars-pylance"
Issues = "https://github.com/jonasdedden/polars-pylance/issues"
Changelog = "https://github.com/jonasdedden/polars-pylance/releases"
Comparison = "https://github.com/jonasdedden/polars-pylance/blob/main/COMPARISON.md"

# Uncomment once polars-cloud allows polars 1.44.0. It pins `polars==1.43.2`
# today, which makes `uv lock` fail outright rather than just the extra.
# [project.optional-dependencies]
# cloud = ["polars-cloud>=0.10"]

[dependency-groups]
# cloudpickle is what polars uses to serialize a callback sink into a cloud
# plan. It normally arrives with polars-cloud; listed here so the remote-write
# tests still run without it.
test = ["pytest>=8", "numpy", "cloudpickle"]
# pyarrow ships no py.typed marker of its own; `pyarrow-stubs` is the community
# stub package, and without it every pyarrow symbol degrades to `Any`.
typing = ["mypy>=1.11", "basedpyright>=1.20", "pyarrow-stubs>=20"]
# Only for `bench/plot.py`, which renders the large-scale results.
# kaleido renders the static PNG/SVG embedded in COMPARISON.md.
bench = ["plotly>=5", "kaleido>=0.2"]
# `dev` is installed by default by `uv run` and `uv sync`, so a bare
# `uv run pytest` or `uv run mypy` needs no flags. mypy and basedpyright both
# check `tests/`, which imports pytest, so the two groups are not separable in
# practice -- hence one `dev` that pulls in both.
dev = [{ include-group = "test" }, { include-group = "typing" }]

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
# Builds without git metadata -- from an unpacked sdist, or Dependabot's
# `uv lock --upgrade-package` -- would otherwise fail outright.
fallback-version = "0.0.0"

# Writes the resolved version into the package so `__version__` never drifts.
# Generated at build time and git-ignored; never edit it.
[tool.hatch.build.hooks.version]
path = "src/polars_pylance/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/polars_pylance"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/polars_pylance",
    "/tests",
    # Anchored: a bare `README.md` is a gitignore-style pattern that would also
    # pull in `bench/README.md`.
    "/README.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    # Deselected in CI (`-m "not cloud"`) while polars-cloud is uninstallable.
    "cloud: exercises the Polars Cloud write path",
]
filterwarnings = [
    # The suite raises no warning today, so a new one is a finding.
    "error",
    # scan_lance and sink_lance are built on polars APIs marked unstable; that is
    # a documented property of this package, not something to be warned about.
    # Only fires under `warn_unstable`, off by default, so this is a safety net
    # for anyone who turns it on rather than something the suite hits.
    "ignore::polars.exceptions.UnstableWarning",
]

[tool.ruff]
# `line-length` is ruff's own default of 88.
src = ["src", "tests", "bench"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "UP", "B", "SIM", "RUF",
    "ASYNC", "C4", "EM", "ERA", "EXE", "FA", "FURB", "G", "ICN",
    "INT", "ISC", "LOG", "NPY", "PERF", "PGH", "PIE", "PT", "PTH", "PYI",
    "Q", "RET", "RSE", "SLF", "SLOT", "T20", "TC", "TD", "TID", "TRY", "N",
]
# Selected by name rather than `ALL` because CI runs an unpinned `uvx ruff`,
# where `ALL` would turn every ruff release into a broken build. Deliberately
# left out: `S` and `PLR2004` (the tests are built out of `assert` and literal
# comparisons), `D` (D401 would force imperative docstrings on a codebase that
# consistently uses noun phrases), `COM` (fights the formatter), `ANN401` (the
# `**kwargs: Any` that forward to Lance are deliberate), `DTZ` (naive datetimes
# are the test data), `FBT`, `A002` (`filter` is the argument name Lance uses),
# `BLE` (the blind `except` in the predicate lowering is the design), and
# `PLC0415` (the deferred imports are deliberate).
ignore = [
    # `_Decline` and `_FilterRejected` are control-flow signals, and read
    # better without the suffix N818 wants.
    "N818",
]

[tool.ruff.lint.per-file-ignores]
"bench/*" = ["T201"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.basedpyright]
include = ["src", "tests"]

typeCheckingMode = "strict"

# Strict, minus the families that report a dependency's typing rather than this
# code. `lance` and `polars` annotate their own returns loosely, so the
# `reportUnknown*` family fires on every value that crosses either boundary.
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
reportUnknownLambdaType = false
# `dtype in (pl.Float32, pl.Float64)` compares a `DataType` against the class
# objects, which polars' own `__eq__` supports and its annotations do not.
reportUnnecessaryContains = false
# The tests reach into `_scan` and `_Lowering` on purpose, and `_remote`
# shares `_dataset_exists` with `_sink`.
reportPrivateUsage = false
# Both remaining sites are the deliberate runtime check behind a signature an
# untyped caller can still get wrong.
reportUnnecessaryIsInstance = false
