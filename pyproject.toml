[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "polars-pylance"
version = "0.1.0"
description = "Lazy, streaming Lance <-> Polars integration: scan_lance() and sink_lance()"
readme = "README.md"
# The distribution name carries the token `pylance`, not `lance`, so these keep
# a bare `lance` in the metadata PyPI searches.
keywords = ["polars", "lance", "arrow", "lazyframe", "streaming"]
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    # 1.44.0 is the floor because it is the first release with both of the fixes
    # this package used to work around: the Arrow C stream deadlock on a
    # PythonDataset scan node (broken 1.43.0-1.43.2) and the unevaluable
    # `dynamic_pred` node pushed to IO plugins (broken 1.39.0-1.43.2).
    "polars>=1.44.0",
    "pylance>=9",
    "pyarrow",
]

[project.optional-dependencies]
# cloudpickle is what polars uses to serialize a callback sink into a cloud
# plan. It normally arrives with polars-cloud; listed here so the remote-write
# tests still run now that the cloud extra is gone.
test = ["pytest>=8", "numpy", "cloudpickle"]
# There is deliberately no `cloud` extra, even though polars_pylance.cloud and
# polars_pylance._remote are written against polars-cloud 0.10 and kept working.
# polars-cloud pins polars with `==` (0.10.0 -> polars==1.43.2), below the floor
# above, so declaring the extra would make the project unresolvable rather than
# merely awkward -- `uv lock` fails, not just `pip install polars-pylance[cloud]`.
# Restore it as `cloud = ["polars-cloud>=<first release pinning polars 1.44>"]`
# once such a release exists; tests/test_remote.py skips until then.

[tool.hatch.build.targets.wheel]
packages = ["src/polars_pylance"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # scan_lance and sink_lance are built on polars APIs marked unstable; that is
    # a documented property of this package, not something to be warned about.
    "ignore::polars.exceptions.UnstableWarning",
]

[tool.ruff]
line-length = 88
src = ["src", "tests", "bench"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"bench/*" = ["T201"]
