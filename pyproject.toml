[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "polars-lance"
version = "0.1.0"
description = "Lazy, streaming Lance <-> Polars integration: scan_lance() and sink_lance()"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    # 1.42.1 is the floor because it already has every API this package needs:
    # collect_batches, sink_batches, defer, and
    # PyLazyFrame.new_from_dataset_object. The cloud extra raises it -- see below.
    "polars>=1.42.1",
    "pylance>=9",
    "pyarrow",
]

[project.optional-dependencies]
test = ["pytest>=8", "numpy"]
# polars-cloud pins an exact polars version, so installing this extra will hold
# polars at whatever that release tracks: 1.43.2 for 0.10, 1.42.1 for 0.9.
# 0.10 is the floor because sink_lance_remote() is built on its sink_batches.
cloud = ["polars-cloud>=0.10"]

[tool.hatch.build.targets.wheel]
packages = ["src/polars_lance"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # scan_lance and sink_lance are built on polars APIs marked unstable; that is
    # a documented property of this package, not something to be warned about.
    "ignore::polars.exceptions.UnstableWarning",
]

[tool.ruff]
line-length = 88
src = ["src", "tests", "bench"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"bench/*" = ["T201"]
