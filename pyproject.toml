[build-system]
# hatchling rather than uv_build: uv_build cannot take a `dynamic` version, so
# it cannot be driven from the git tag.
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[project]
name = "polars-pylance"
# Derived from the git tag by uv-dynamic-versioning; see [tool.hatch.version].
dynamic = ["version"]
description = "Lazy, streaming Lance <-> Polars integration: scan_lance() and sink_lance()"
readme = "README.md"
keywords = ["polars", "lance", "arrow", "lazyframe", "streaming"]
requires-python = ">=3.10"
authors = [{ name = "Jonas Dedden" }]
license = "MIT"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    # 1.44.0 was the first release without the unevaluable `dynamic_pred`
    # node pushed to IO plugins (broken 1.39.0-1.43.2), which is the hook
    # `scan_lance` is built on. 1.44.1 is also the first release to annotate
    # `collect_batches` as what it returns, which `sink_lance` relies on.
    "polars>=1.44.1",
    "pylance>=9",
    "pyarrow",
]

[project.urls]
Homepage = "https://github.com/jonasdedden/polars-pylance"
# `Documentation` is one of the well-known labels, so PyPI renders it with an
# icon in the sidebar rather than as a plain link. The site root rather than a
# version: it redirects to whatever `mike set-default` points at, so the link
# keeps working as `stable` moves.
Documentation = "https://jonasdedden.github.io/polars-pylance/"
Repository = "https://github.com/jonasdedden/polars-pylance"
Issues = "https://github.com/jonasdedden/polars-pylance/issues"
Changelog = "https://github.com/jonasdedden/polars-pylance/releases"
Comparison = "https://github.com/jonasdedden/polars-pylance/blob/main/COMPARISON.md"

[dependency-groups]
# cloudpickle is what polars uses to serialize a callback sink into a cloud
# plan. It normally arrives with polars-cloud; listed here so the remote-write
# tests still run without it.
test = ["pytest>=8", "numpy", "cloudpickle"]
# pyarrow ships no py.typed marker of its own; `pyarrow-stubs` is the community
# stub package. `test` included because `tests/`'s type checking depends on it.
typing = [
    "mypy>=1.11",
    "basedpyright>=1.20",
    "pyarrow-stubs>=20",
    { include-group = "test" },
]
# Pinned here because "ALL" rules.
lint = ["ruff>=0.16.5"]
# Only for `bench/plot.py`, which renders the large-scale results.
# kaleido renders the static PNG/SVG embedded in COMPARISON.md.
bench = ["plotly>=5", "kaleido>=0.2"]
# `properdocs build --strict` renders the site. ProperDocs is the maintained
# continuation of MkDocs 1.x, by its last active maintainer: `mkdocs` itself has
# had no release since 1.6.1 in August 2024, and the "MkDocs 2.0" that is
# proposed to follow it drops the plugin system this site is built on. It is a
# drop-in replacement, so `mkdocs.yml` and every plugin below are unchanged.
# `mkdocs` still arrives transitively, because material, mkdocstrings and mike
# have not moved their own pins yet.
# `gen-files` and `literate-nav` are what `scripts/gen_ref_pages.py` uses to
# emit one API page per public module; `mike` publishes the versioned copies.
docs = [
    "properdocs>=1.6.7",
    "mkdocs-material>=9",
    "mkdocstrings[python]>=0.26",
    "mkdocs-gen-files>=0.6",
    "mkdocs-literate-nav>=0.6",
    "mike>=2.2",
]
dev = [
    { include-group = "test" },
    { include-group = "typing" },
    { include-group = "lint" },
]

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
fallback-version = "0.0.0"

# Writes the resolved version into the package so `__version__` never drifts.
# Generated at build time and git-ignored; never edit it.
[tool.hatch.build.hooks.version]
path = "src/polars_pylance/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/polars_pylance"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/polars_pylance",
    "/tests",
    # Anchored: a bare `README.md` is a gitignore-style pattern that would also
    # pull in `bench/README.md`.
    "/README.md",
]

[tool.pytest.ini_options]
# `src` is here for the doctests, not for tests: `--doctest-modules` collects
# the `Examples:` blocks so a broken one fails the suite. They used to be dead
# text, and three of them did not run at all.
testpaths = ["tests", "src"]
addopts = ["--doctest-modules"]
markers = [
    # Deselected in CI (`-m "not cloud"`) while polars-cloud is uninstallable.
    "cloud: exercises the Polars Cloud write path",
]
filterwarnings = [
    # The suite raises no warning today, so a new one is a finding.
    "error",
    # `register_io_source` (scan_lance), `collect_batches` (sink_lance) and
    # `sink_batches` (the Polars Cloud write) all still carry polars'
    # `@unstable()` in 1.44.1.
    "ignore::polars.exceptions.UnstableWarning",
]

[tool.ruff]
src = ["src", "tests", "bench"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # ruff warns that this one conflicts with its own formatter.
    "COM812",
    # The licence is declared once, in project metadata, not per file.
    "CPY001",
    # `_Decline` and `_FilterRejected` are control-flow signals, and read
    # better without the suffix N818 wants.
    "N818",
    # Imports are deferred in a few places to keep import cost off the module
    # path; each one says why where it sits.
    "PLC0415",
    # `scan_lance`, `sink_lance` and friends take many keyword options because
    # Lance does. Splitting them up would be worse.
    "PLR0913",
    "PLR0917",
    # `assert` is how this codebase narrows a type the checker cannot, and it
    # is what the tests are built out of.
    "S101",
]

# The docstrings are Google-style, which is what `mkdocstrings` parses. Setting
# the convention also switches off the rules belonging to the other two, which
# is where the D203/D213/D401 ignores went.
[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# The tests are built out of `assert`, literal comparisons and fixtures that
# are requested for their side effects; and pytest collects them by name, so
# the docstring rules for public callables do not apply.
"tests/*" = [
    "A002",
    "ARG005",
    "D100",
    "D103",
    "DTZ001",
    "FBT003",
    "PLR2004",
    "PLW0177",
    "S301",
    "S311",
]
# Run by `mkdocs-gen-files` by path, not imported, so it is no more a package
# than `bench/` is.
"scripts/*" = ["INP001"]
# Benchmark scripts: they print, they shell out, and they are run by path
# rather than imported.
"bench/*" = [
    "ANN401",
    "BLE001",
    "D103",
    "INP001",
    "PLR2004",
    "PLW0603",
    "S110",
    "S603",
    "T201",
]
# `filter` is the argument name Lance's own `scanner()` uses; renaming it here
# would make the passthrough read worse.
"src/polars_pylance/_scan.py" = ["A002"]
# The lowering is one dispatch chain per IR position, so it is all returns and
# branches, and `len(args) != 2` is clearer than a named constant.
"src/polars_pylance/_predicate.py" = ["C901", "PLR0911", "PLR0912", "PLR2004"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.basedpyright]
include = ["src", "tests"]

typeCheckingMode = "strict"

# Makes a `# pyright: ignore[...]` that has stopped being needed an error, so
# the suppressions below expire on their own when the typing they work around
# improves. Also covers the handful of mypy `# type: ignore` comments.
reportUnnecessaryTypeIgnoreComment = "error"

# Strict, minus the one family that reports a dependency's typing rather than
# this code: `lance` and `polars` annotate their own returns loosely, so
# `reportUnknown*` fires on every value that crosses either boundary. That is
# 95 lines, almost all of them a bare call into one of the two, which is why
# this is a switch rather than 95 comments. To find out whether an upgrade has
# fixed it, comment these four out and run basedpyright.
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
reportUnknownLambdaType = false

# The tests reach into `_scan`, `_Lowering` and `_Decline` on purpose.
[[tool.basedpyright.executionEnvironments]]
root = "tests"
reportPrivateUsage = "none"
