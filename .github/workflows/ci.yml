name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a branch makes the in-flight run for that branch pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-suffix: ${{ github.job }}
      - name: lint
        run: uv run --only-group lint ruff check --output-format=github .
      - name: format
        run: uv run --only-group lint ruff format --check .

  mypy:
    name: mypy --strict
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-suffix: ${{ github.job }}
      # Strictness and the file list live in `[tool.mypy]`, so this matches what
      # `mypy` does locally.
      - run: uv run --no-default-groups --group typing mypy

  basedpyright:
    name: basedpyright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-suffix: ${{ github.job }}
      # Strictness and the file list live in `[tool.basedpyright]`, so this matches what
      # `basedpyright` does locally.
      - run: uv run --no-default-groups --group typing basedpyright

  docs:
    name: properdocs --strict
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-suffix: ${{ github.job }}
      # `--strict` turns an unresolved cross-reference into a failure, which is
      # what keeps the docstring markup from rotting. griffe reads `src` without
      # importing it, so this needs no runtime dependency beyond the docs group.
      - run: uv run --no-default-groups --group docs properdocs build --strict

  pytest:
    name: pytest (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-suffix: ${{ github.job }}-${{ matrix.python-version }}
      # `-m "not cloud"` deselects the Polars Cloud write path. Drop the flag
      # once a polars-cloud release tracks polars 1.44.
      # Only the `test` group: the type checkers are irrelevant here, and this
      # job installs five times over.
      - run: uv run --python ${{ matrix.python-version }} --no-default-groups --group test pytest -q -m "not cloud"
