site_name: polars-pylance
site_description: Lazy, streaming Lance <-> Polars integration
repo_url: https://github.com/jonasdedden/polars-pylance
docs_dir: docs

theme:
  name: material
  features:
    - navigation.sections
    - navigation.indexes
    - toc.follow
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.superfences
  - toc:
      permalink: true

plugins:
  - search
  - gen-files:
      scripts: [scripts/gen_ref_pages.py]
  - literate-nav:
      nav_file: SUMMARY.md
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          inventories:
            - https://docs.python.org/3/objects.inv
            - https://arrow.apache.org/docs/objects.inv
            - https://docs.pola.rs/api/python/stable/objects.inv
          options:
            docstring_style: google
            show_root_heading: true
            show_source: true
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            show_symbol_type_toc: true
            show_symbol_type_heading: true
            heading_level: 2

nav:
  - Home: index.md
  - Predicate pushdown: PUSHDOWN.md
  - Vector search: VECTOR_SEARCH.md
  - API reference: reference/
